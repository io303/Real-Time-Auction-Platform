server:
  port: ${PORT:8081}

spring:
  application:
    name: auction-platform

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  sql:
    init:
      mode: never

  jackson:
    serialization:
      write-dates-as-timestamps: false

  # =========================
  # GMAIL SMTP
  # =========================
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB


# =========================
# APPLICATION CONFIG
# =========================

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000

  frontend:
    base-url: ${FRONTEND_URL}

  email:
    verification-token-expiration-minutes: 1440
    password-reset-token-expiration-minutes: 15

  storage:
    local:
      base-path: ${UPLOAD_PATH:./uploads}

  scheduler:
    start-check-interval-ms: 10000
    end-check-interval-ms: 10000
    ending-soon-check-interval-ms: 15000

  auction:
    anti-snipe:
      window-seconds: 15
      extension-minutes: 2

  notification:
    ending-soon-minutes: 5


# =========================
# SWAGGER
# =========================

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html


# =========================
# LOGGING
# =========================

logging:
  level:
    com.auction.platform: INFO


# =========================
# RAZORPAY
# =========================

razorpay:
  key-id: ${RAZORPAY_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}