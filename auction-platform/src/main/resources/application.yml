server:
  port: ${PORT:8081}

spring:
  application:
    name: auction-platform

  spring:
    datasource:
      url: jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      username: ${MYSQLUSER}
      password: ${MYSQLPASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

  jackson:
    serialization:
      write-dates-as-timestamps: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB


app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000

  frontend:
    base-url: ${FRONTEND_URL:http://localhost:3002}

  email:
    verification-token-expiration-minutes: 1440
    password-reset-token-expiration-minutes: 15

  storage:
    local:
      base-path: ./uploads

  scheduler:
    start-check-interval-ms: 10000
    end-check-interval-ms: 10000
    ending-soon-check-interval-ms: 15000

  auction:
    anti-snipe:
      window-seconds: 15
      extension-minutes: 2

  notification:
    ending-soon-minutes: 5


springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html


logging:
  level:
    com.auction.platform: INFO


razorpay:
  key-id: ${RAZORPAY_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}