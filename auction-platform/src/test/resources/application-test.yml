spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  sql:
    init:
      mode: never

app:
  jwt:
    secret: test-secret-key-for-jwt-signing-in-unit-tests-only-0123456789
    access-token-expiration-ms: 900000
